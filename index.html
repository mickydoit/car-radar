<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Radar</title>
<style>
:root{--bg:#F8F6F2;--ink:#111;--mute:#6e6e6e;--line:#e2e2e2;--panel:#fff;--green:#263B1C;--red:#d7282f}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--ink:#f1eee8;--mute:#9a9a94;--line:#2c2c29;--panel:#1c1c1a;--green:#cbbcff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Helvetica Neue",Inter,Arial,sans-serif}
header{padding:28px 16px 8px;max-width:1200px;margin:auto}
h1{font-size:clamp(34px,7vw,64px);letter-spacing:-.04em;margin:0;font-weight:500}
.sub{color:var(--mute);margin:4px 0 0}
.demo{background:var(--green);color:var(--bg);padding:8px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
main{max-width:1200px;margin:auto;padding:8px 16px 60px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
aside{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:12px 0}
@media(max-width:820px){aside{position:static;max-height:none}}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:14px 0 5px}
select,input{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--green);color:var(--bg);border-color:var(--green)}
.reset{margin-top:18px;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit}
.bar{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.bar b{font-size:22px;font-weight:500}
.bar select{width:auto}
.car{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.car h3{margin:0;font-size:18px;font-weight:500}
.car .meta{color:var(--mute);font-size:13px}
.price{text-align:right;font-size:20px;font-variant-numeric:tabular-nums}
.price small{display:block;font-size:12px;color:var(--green)}
.tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:4px}
.tag.v{color:var(--red);border-color:var(--red)}
a{color:inherit}
.empty{padding:40px 0;color:var(--mute)}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>Demo data. The daily research run has not published real listings yet</div>
<header><h1>Car Radar</h1><p class="sub" id="upd"></p></header>
<main>
<aside>
<label>Make</label><select id="make"></select>
<label>Model</label><select id="model"></select>
<label>Year</label><div class="row"><select id="yFrom"></select><select id="yTo"></select></div>
<label>Kilometres</label>
<div class="row"><input id="kmMin" type="number" min="0" step="5000" placeholder="Min km"><input id="kmMax" type="number" min="0" step="5000" placeholder="Max km"></div>
<label>Price (AUD)</label>
<div class="row"><input id="pMin" type="number" min="0" step="1000" placeholder="Min $"><input id="pMax" type="number" min="0" step="1000" placeholder="Max $"></div>
<div class="chips" id="brackets" style="margin-top:8px"></div>
<label>Seller</label><select id="seller"><option value="">Any</option><option value="dealer">Dealer</option><option value="private">Private</option><option value="auction">Auction</option></select>
<label>State</label><select id="state"></select>
<label>Gearbox</label><select id="trans"><option value="">Any</option><option>Auto</option><option>Manual</option></select>
<label><span class="chip" id="deals" role="button" tabindex="0">Below market only (3%+)</span></label>
<button class="reset" id="reset">Reset filters</button>
</aside>
<section>
<div class="bar"><b id="count"></b><span id="med" class="meta"></span>
<select id="sort"><option value="deal">Best deals</option><option value="new">Newest</option><option value="pa">Price, low to high</option><option value="pd">Price, high to low</option><option value="ka">Lowest km</option><option value="yd">Newest year</option></select></div>
<div id="list"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const BR=[[0,10000],[10000,20000],[20000,30000],[30000,50000],[50000,0]];
let D=[];
const fmt=n=>'$'+Math.round(n).toLocaleString('en-AU');
const num=v=>{v=parseFloat(v);return isNaN(v)?null:v};
const IDS=['make','model','yFrom','yTo','kmMin','kmMax','pMin','pMax','seller','state','trans','sort'];
function opts(el,vals,any){el.innerHTML=(any?`<option value="">${any}</option>`:'')+vals.map(v=>`<option>${v}</option>`).join('')}
function uniq(a){return [...new Set(a)].sort()}
function state(){const o={};IDS.forEach(i=>{if($(i).value)o[i]=$(i).value});if($('deals').classList.contains('on'))o.deals=1;return o}
function save(){history.replaceState(null,'','#'+new URLSearchParams(state()))}
function load(){const p=new URLSearchParams(location.hash.slice(1));
 refreshModels(p.get('make')||'');
 IDS.forEach(i=>{if(p.has(i))$(i).value=p.get(i)});
 $('deals').classList.toggle('on',p.has('deals'))}
function refreshModels(mk){const keep=$('model').value;
 opts($('model'),uniq(D.filter(d=>!mk||d.make===mk).map(d=>d.model)),'All models');
 if([...$('model').options].some(o=>o.value===keep))$('model').value=keep}
function brackets(){const pMin=num($('pMin').value)||0,pMax=num($('pMax').value)||0;
 $('brackets').innerHTML=BR.map(([a,b])=>{const on=a===pMin&&b===pMax;
 return `<button class="chip${on?' on':''}" data-a="${a}" data-b="${b}">${b?(a?`${a/1000}–${b/1000}k`:`Under ${b/1000}k`):`${a/1000}k+`}</button>`}).join('')}
function filtered(){const f=state();
 return D.filter(d=>(!f.make||d.make===f.make)&&(!f.model||d.model===f.model)
 &&(!f.yFrom||d.year>=+f.yFrom)&&(!f.yTo||d.year<=+f.yTo)
 &&(!f.kmMin||d.km>=+f.kmMin)&&(!f.kmMax||d.km<=+f.kmMax)
 &&(!f.pMin||d.price_aud>=+f.pMin)&&(!f.pMax||d.price_aud<=+f.pMax)
 &&(!f.seller||d.seller_type===f.seller)&&(!f.state||d.state===f.state)&&(!f.trans||d.transmission===f.trans)
 &&(!f.deals||(d.below_market_pct||0)>=3))}
const SORT={deal:(a,b)=>(b.below_market_pct||0)-(a.below_market_pct||0),new:(a,b)=>b.first_seen_at.localeCompare(a.first_seen_at),
 pa:(a,b)=>a.price_aud-b.price_aud,pd:(a,b)=>b.price_aud-a.price_aud,ka:(a,b)=>a.km-b.km,yd:(a,b)=>b.year-a.year};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function link(d){return d.url||'https://duckduckgo.com/?q='+encodeURIComponent(`${d.year} ${d.make} ${d.model} ${d.variant||''} ${d.km} km`)}
function render(){save();brackets();
 const r=filtered().sort(SORT[$('sort').value]);
 $('count').textContent=`${r.length} car${r.length===1?'':'s'}`;
 const ps=r.map(d=>d.price_aud).sort((a,b)=>a-b);
 $('med').textContent=ps.length?`Median ${fmt(ps[Math.floor(ps.length/2)])} · range ${fmt(ps[0])}–${fmt(ps[ps.length-1])}`:'';
 $('list').innerHTML=r.length?r.map(d=>{const bm=d.below_market_pct;
 return `<a class="car" href="${esc(link(d))}" target="_blank" rel="noopener" style="text-decoration:none">
 <div><h3>${d.year} ${esc(d.make)} ${esc(d.model)} ${esc(d.variant||'')}</h3>
 <div class="meta">${d.km.toLocaleString('en-AU')} km · ${esc(d.transmission||'')} · ${esc(d.suburb||'')}, ${esc(d.state||'')} · ${esc(d.source)} (${esc(d.seller_type||'')})</div>
 <div class="meta">${(d.flags||[]).includes('verify')?'<span class="tag v">Verify</span>':''}${d.first_seen_at>=D.cut?'<span class="tag">New</span>':''}${d.url?'':'<span class="tag">No direct link</span>'}</div></div>
 <div class="price">${fmt(d.price_aud)}${bm>=3?`<small>${bm}% under market</small>`:''}</div></a>`}).join(''):'<div class="empty">Nothing matches. Loosen a filter.</div>'}
fetch('data/latest.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{
 D=(j.listings||[]).filter(d=>!['sold','removed'].includes(d.status));
 const c=new Date(Date.now()-864e5*2).toISOString().slice(0,10);D.cut=c;
 $('demo').hidden=!j.demo;
 $('upd').textContent=j.updated?`Updated ${new Date(j.updated).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'})} · ${D.length} listings`:'';
 opts($('make'),uniq(D.map(d=>d.make)),'All makes');
 const ys=uniq(D.map(d=>d.year));opts($('yFrom'),ys,'Year from');opts($('yTo'),ys.slice().reverse(),'Year to');
 opts($('state'),uniq(D.map(d=>d.state).filter(Boolean)),'Any state');
 load();render();
}).catch(()=>{$('list').innerHTML='<div class="empty">Could not load data/latest.json</div>'});
$('make').onchange=()=>{refreshModels($('make').value);$('model').value='';render()};
IDS.filter(i=>i!=='make').forEach(i=>$(i).addEventListener('input',render));
$('brackets').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=+b.dataset.a,z=+b.dataset.b;
 const on=(num($('pMin').value)||0)===a&&(num($('pMax').value)||0)===z;
 $('pMin').value=on?'':(a||'');$('pMax').value=on?'':(z||'');render()};
$('deals').onclick=()=>{$('deals').classList.toggle('on');render()};
$('reset').onclick=()=>{IDS.forEach(i=>{if(i!=='sort')$(i).value=''});$('deals').classList.remove('on');refreshModels('');render()};
</script>
</body>
</html>
