<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Radar</title>
<style>
:root{--bg:#F8F6F2;--ink:#111;--mute:#6e6e6e;--line:#e2e2e2;--panel:#fff;--green:#263B1C;--red:#d7282f}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--ink:#f1eee8;--mute:#9a9a94;--line:#2c2c29;--panel:#1c1c1a;--green:#cbbcff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Helvetica Neue",Inter,Arial,sans-serif}
header{padding:28px 16px 8px;max-width:1200px;margin:auto}
h1{font-size:clamp(34px,7vw,64px);letter-spacing:-.04em;margin:0;font-weight:500}
.sub{color:var(--mute);margin:4px 0 0}
.demo{background:var(--green);color:var(--bg);padding:8px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
main{max-width:1200px;margin:auto;padding:8px 16px 60px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
aside{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:12px 0}
@media(max-width:820px){aside{position:static;max-height:none}}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:14px 0 5px}
select,input{width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--green);color:var(--bg);border-color:var(--green)}
.reset{margin-top:18px;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit}
.bar{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.bar b{font-size:22px;font-weight:500}
.bar select{width:auto}
.car{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.car h3{margin:0;font-size:18px;font-weight:500}
.car .meta{color:var(--mute);font-size:13px}
.price{text-align:right;font-size:20px;font-variant-numeric:tabular-nums}
.price small{display:block;font-size:12px;color:var(--green)}
.tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:4px}
.tag.v{color:var(--red);border-color:var(--red)}
.run{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.run i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.run.fresh i{background:#3a9a4f}.run.stale i{background:#d9a21b}.run.old i{background:var(--red)}
.run.live i{background:#3a9a4f;animation:p 1.1s ease-in-out infinite}
@keyframes p{50%{opacity:.25;transform:scale(1.5)}}
a{color:inherit}
.empty{padding:40px 0;color:var(--mute)}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>Demo data. The daily research run has not published real listings yet</div>
<header><h1>Car Radar</h1><p class="sub" id="upd"></p>
<p class="run" id="run"><i></i><span></span></p></header>
<main>
<aside>
<label>Make <span class="meta" id="mkN"></span></label><div class="chips" id="makes"></div>
<label>Model <span class="meta" id="mdN"></span></label><div id="models"><span class="meta">Pick a make first</span></div>
<label>Year</label><div class="row"><select id="yFrom"></select><select id="yTo"></select></div>
<label>Kilometres</label>
<div class="row"><input id="kmMin" type="number" min="0" step="5000" placeholder="Min km"><input id="kmMax" type="number" min="0" step="5000" placeholder="Max km"></div>
<label>Price (AUD)</label>
<div class="row"><input id="pMin" type="number" min="0" step="1000" placeholder="Min $"><input id="pMax" type="number" min="0" step="1000" placeholder="Max $"></div>
<div class="chips" id="brackets" style="margin-top:8px"></div>
<label>Seller</label><select id="seller"><option value="">Any</option><option value="dealer">Dealer</option><option value="private">Private</option><option value="auction">Auction</option></select>
<label>State</label><select id="state"></select>
<label>Within distance of</label>
<input id="near" placeholder="Suburb or postcode, e.g. 4000">
<div class="row" style="margin-top:8px"><select id="radius"><option value="">Any distance</option><option>10</option><option>25</option><option>50</option><option>100</option><option>200</option><option>500</option></select><button class="chip" id="geo" type="button">Use my location</button></div>
<div class="meta" id="nearMsg" style="margin-top:6px"></div>
<label>Gearbox</label><select id="trans"><option value="">Any</option><option>Auto</option><option>Manual</option></select>
<label><span class="chip" id="deals" role="button" tabindex="0">Below market only (3%+)</span></label>
<button class="reset" id="reset">Reset filters</button>
</aside>
<section>
<div class="bar"><b id="count"></b><span id="med" class="meta"></span>
<select id="sort"><option value="deal">Best deals</option><option value="new">Newest</option><option value="pa">Price, low to high</option><option value="pd">Price, high to low</option><option value="ka">Lowest km</option><option value="yd">Newest year</option></select></div>
<div id="list"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const BR=[[0,10000],[10000,20000],[20000,30000],[30000,50000],[50000,0]];
let D=[];
const fmt=n=>'$'+Math.round(n).toLocaleString('en-AU');
const num=v=>{v=parseFloat(v);return isNaN(v)?null:v};
const IDS=['near','radius','yFrom','yTo','kmMin','kmMax','pMin','pMax','seller','state','trans','sort'];
function opts(el,vals,any){el.innerHTML=(any?`<option value="">${any}</option>`:'')+vals.map(v=>`<option>${v}</option>`).join('')}
function uniq(a){return [...new Set(a)].sort()}
let MAKES=new Set(),MODELS=new Set();
function state(){const o={};IDS.forEach(i=>{if($(i).value)o[i]=$(i).value});if(MAKES.size)o.make=[...MAKES].join(',');if(MODELS.size)o.model=[...MODELS].join(',');if($('deals').classList.contains('on'))o.deals=1;return o}
function save(){history.replaceState(null,'','#'+new URLSearchParams(state()))}
function load(){const p=new URLSearchParams(location.hash.slice(1));
 MAKES=new Set((p.get('make')||'').split(',').filter(Boolean));MODELS=new Set((p.get('model')||'').split(',').filter(Boolean));
 IDS.forEach(i=>{if(p.has(i))$(i).value=p.get(i)});
 $('deals').classList.toggle('on',p.has('deals'))}
function chip(label,on,attr){return `<button class="chip${on?' on':''}" ${attr}>${esc(label)}</button>`}
function drawMakes(){const cnt={};D.forEach(d=>cnt[d.make]=(cnt[d.make]||0)+1);
 $('makes').innerHTML=uniq(D.map(d=>d.make)).map(m=>chip(`${m} ${cnt[m]}`,MAKES.has(m),`data-make="${esc(m)}"`)).join('');
 $('mkN').textContent=MAKES.size?`· ${MAKES.size} selected`:'· any';
 const ms=[...MAKES].sort();
 $('models').innerHTML=ms.length?ms.map(m=>{const names=uniq(D.filter(d=>d.make===m).map(d=>d.model));
  return `<div class="meta" style="margin:8px 0 4px">${esc(m)}</div><div class="chips">`+names.map(n=>chip(n,MODELS.has(m+'|'+n),`data-model="${esc(m+'|'+n)}"`)).join('')+'</div>'}).join(''):'<span class="meta">Pick a make first</span>';
 $('mdN').textContent=MODELS.size?`· ${MODELS.size} selected`:'· all of the chosen makes'}
function togg(set,v){set.has(v)?set.delete(v):set.add(v)}
function brackets(){const pMin=num($('pMin').value)||0,pMax=num($('pMax').value)||0;
 $('brackets').innerHTML=BR.map(([a,b])=>{const on=a===pMin&&b===pMax;
 return `<button class="chip${on?' on':''}" data-a="${a}" data-b="${b}">${b?(a?`${a/1000}–${b/1000}k`:`Under ${b/1000}k`):`${a/1000}k+`}</button>`}).join('')}
let PL=null,ORIGIN=null,GEO=null;
const rad=x=>x*Math.PI/180;
function km(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function loadPlaces(){if(!PL)PL=fetch('data/places.json').then(r=>r.json()).catch(()=>({places:{},postcodes:{}}));return PL}
function resolve(txt,pl){txt=txt.trim().toLowerCase();if(!txt)return null;
 if(/^\d{4}$/.test(txt))return pl.postcodes[txt]||null;
 const m=txt.match(/^(.*?)[ ,]+(act|nsw|nt|qld|sa|tas|vic|wa)$/);
 if(m)return pl.places[m[1]+'|'+m[2].toUpperCase()]||null;
 for(const s of ['QLD','NSW','VIC','WA','SA','TAS','ACT','NT']){const v=pl.places[txt+'|'+s];if(v)return v}return null}
function locOf(d,pl){if(d.lat!=null&&d.lng!=null)return [d.lat,d.lng];
 if(d.postcode&&pl.postcodes[d.postcode])return pl.postcodes[d.postcode];
 const n=String(d.suburb||'').toLowerCase().trim();
 for(const v of [n,n.replace(/\bsaint\b/g,'st'),n.replace(/\bst\b/g,'saint'),n.replace(/\bmount\b/g,'mt'),n.replace(/\bmt\b/g,'mount')]){const r=pl.places[v+'|'+d.state];if(r)return r}return null}
async function updateOrigin(){const t=$('near').value;
 if(t==='My location'){ORIGIN=GEO;if(!GEO)$('nearMsg').textContent='Press Use my location again.'}else{const pl=await loadPlaces();ORIGIN=resolve(t,pl)}
 $('nearMsg').textContent=t&&!ORIGIN?'Location not found. Try a postcode.':'';render()}
function filtered(){const f=state();
 const hasM={};MODELS.forEach(k=>hasM[k.split('|')[0]]=1);
 return D.filter(d=>(!MAKES.size||MAKES.has(d.make))&&(!hasM[d.make]||MODELS.has(d.make+'|'+d.model))
 &&(!f.yFrom||d.year>=+f.yFrom)&&(!f.yTo||d.year<=+f.yTo)
 &&(!f.kmMin||d.km>=+f.kmMin)&&(!f.kmMax||d.km<=+f.kmMax)
 &&(!f.pMin||d.price_aud>=+f.pMin)&&(!f.pMax||d.price_aud<=+f.pMax)
 &&(!f.seller||d.seller_type===f.seller)&&(!f.state||d.state===f.state)&&(!f.trans||d.transmission===f.trans)
 &&(!f.deals||(d.below_market_pct||0)>=3)
 &&nearOk(d,f))}
let SKIP=0;
function nearOk(d,f){if(!f.radius||!ORIGIN||!PLd)return true;const p=locOf(d,PLd);if(!p){SKIP++;return false}d.dist=km(ORIGIN,p);return d.dist<=+f.radius}
let PLd=null;loadPlaces().then(p=>{PLd=p;render()});
const SORT={deal:(a,b)=>(b.below_market_pct||0)-(a.below_market_pct||0),new:(a,b)=>b.first_seen_at.localeCompare(a.first_seen_at),
 pa:(a,b)=>a.price_aud-b.price_aud,pd:(a,b)=>b.price_aud-a.price_aud,ka:(a,b)=>a.km-b.km,yd:(a,b)=>b.year-a.year};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function link(d){return d.url||'https://duckduckgo.com/?q='+encodeURIComponent(`${d.year} ${d.make} ${d.model} ${d.variant||''} ${d.km} km`)}
let READY=false;
function render(){if(!READY)return;save();brackets();drawMakes();
 SKIP=0;const r=filtered().sort(SORT[$('sort').value]);if($('radius').value&&ORIGIN&&SKIP)$('nearMsg').textContent=SKIP+' listing'+(SKIP>1?'s':'')+' hidden: suburb not recognised';
 $('count').textContent=`${r.length} car${r.length===1?'':'s'}`;
 const ps=r.map(d=>d.price_aud).sort((a,b)=>a-b);
 $('med').textContent=ps.length?`Median ${fmt(ps[Math.floor(ps.length/2)])} · range ${fmt(ps[0])}–${fmt(ps[ps.length-1])}`:'';
 $('list').innerHTML=r.length?r.map(d=>{const bm=d.below_market_pct;
 return `<a class="car" href="${esc(link(d))}" target="_blank" rel="noopener" style="text-decoration:none">
 <div><h3>${d.year} ${esc(d.make)} ${esc(d.model)} ${esc(d.variant||'')}</h3>
 <div class="meta">${d.km.toLocaleString('en-AU')} km · ${esc(d.transmission||'')} · ${esc(d.suburb||'')}, ${esc(d.state||'')}${d.dist!=null&&$('radius').value?' ('+Math.round(d.dist)+' km away)':''} · ${esc(d.source)} (${esc(d.seller_type||'')})</div>
 <div class="meta">${(d.flags||[]).includes('verify')?'<span class="tag v">Verify</span>':''}${d.first_seen_at>=D.cut?'<span class="tag">New</span>':''}${d.url?'':'<span class="tag">No direct link</span>'}</div></div>
 <div class="price">${fmt(d.price_aud)}${bm>=3?`<small>${bm}% under market</small>`:''}</div></a>`}).join(''):'<div class="empty">Nothing matches. Loosen a filter.</div>'}
fetch('data/latest.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{
 D=(j.listings||[]).filter(d=>!['sold','removed'].includes(d.status));
 const c=new Date(Date.now()-864e5*2).toISOString().slice(0,10);D.cut=c;
 $('demo').hidden=!j.demo;LAST=j.demo?null:Date.parse(j.updated);runStat();
 $('upd').textContent=j.updated?`Updated ${new Date(j.updated).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short',timeZone:'Australia/Brisbane'})+' AEST'} · ${D.length} listings`:'';
  const top=new Date().getFullYear()+1,lo=Math.min(2010,...D.map(d=>d.year)),ys=[];for(let y=top;y>=lo;y--)ys.push(y);opts($('yFrom'),ys,'Year from');opts($('yTo'),ys,'Year to');
 opts($('state'),['ACT','NSW','NT','QLD','SA','TAS','VIC','WA'],'Any state');
 load();READY=true;render();if($('near').value&&$('near').value!=='My location')updateOrigin();
}).catch(()=>{$('list').innerHTML='<div class="empty">Could not load data/latest.json</div>'});
let LAST=null,ST=null;
function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<48)return h+' h ago';return Math.round(h/24)+' days ago'}
function runStat(){const el=$('run'),tx=el.querySelector('span');
 const live=ST&&ST.state==='running'&&Date.now()-Date.parse(ST.started_at)<75*6e4;
 if(live){el.className='run live';tx.textContent='Run in progress · started '+ago(Date.parse(ST.started_at));return}
 if(!LAST){el.className='run';tx.textContent='No run yet';return}
 const h=(Date.now()-LAST)/36e5;
 el.className='run '+(h<26?'fresh':h<50?'stale':'old');
 tx.textContent='Last run '+ago(LAST)+(h>=26?' · overdue':'')+' · next about 08:00 Brisbane'}
function pollStatus(){fetch('data/status.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ST=j;runStat()}).catch(()=>{})}
setInterval(runStat,30000);setInterval(pollStatus,60000);pollStatus();
$('near').addEventListener('change',updateOrigin);
$('geo').onclick=()=>{if(!navigator.geolocation){$('nearMsg').textContent='Location not available in this browser.';return}
 navigator.geolocation.getCurrentPosition(p=>{GEO=[p.coords.latitude,p.coords.longitude];$('near').value='My location';if(!$('radius').value)$('radius').value='50';updateOrigin()},()=>{$('nearMsg').textContent='Location permission denied.'})};
$('makes').onclick=e=>{const b=e.target.closest('[data-make]');if(!b)return;const m=b.dataset.make;togg(MAKES,m);
 if(!MAKES.has(m))[...MODELS].forEach(k=>{if(k.startsWith(m+'|'))MODELS.delete(k)});render()};
$('models').onclick=e=>{const b=e.target.closest('[data-model]');if(!b)return;togg(MODELS,b.dataset.model);render()};
IDS.forEach(i=>$(i).addEventListener('input',render));
$('brackets').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=+b.dataset.a,z=+b.dataset.b;
 const on=(num($('pMin').value)||0)===a&&(num($('pMax').value)||0)===z;
 $('pMin').value=on?'':(a||'');$('pMax').value=on?'':(z||'');render()};
$('deals').onclick=()=>{$('deals').classList.toggle('on');render()};
$('reset').onclick=()=>{MAKES.clear();MODELS.clear();ORIGIN=null;$('nearMsg').textContent='';IDS.forEach(i=>{if(i!=='sort')$(i).value=''});$('deals').classList.remove('on');render()};
</script>
</body>
</html>
