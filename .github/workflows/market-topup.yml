name: market top-up
# Small, polite CarsGuide crawl every 4 hours into data/market-cache.json (no Claude usage).
# The 08:00 Brisbane routine assembles latest.json from this cache instead of crawling in one burst,
# which is what triggered the Peakhour challenge pages (HTTP 403) on ~45% of requests.
# SCHEDULE DISABLED 6 Nov 2026: GitHub runner addresses are challenged on 100% of requests (0/12 test run),
# so the top-up runs from a residential or Claude-cloud host instead. Manual dispatch kept for tests.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: pages to fetch
        default: '60'
      fresh_hours:
        description: skip pages fetched OK within this many hours
        default: '6'
permissions:
  contents: write
concurrency:
  group: market-topup
  cancel-in-progress: false
jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Crawl (honest UA, ≥12 s between requests, back-off on 403)
        run: python3 tools/marketplace.py --budget ${{ github.event.inputs.budget || 60 }} --min-interval 12 --fresh-hours ${{ github.event.inputs.fresh_hours || 6 }} | tail -5
      - name: Commit cache
        run: |
          git config user.name "car-radar bot"
          git config user.email "car-radar-bot@users.noreply.github.com"
          git add data/market-cache.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "radar: market top-up $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
